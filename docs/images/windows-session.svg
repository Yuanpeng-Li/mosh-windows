<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 288" width="1000" height="288" role="img" aria-labelledby="title desc">
  <title id="title">Mosh for Windows</title>
  <desc id="desc">A laptop reaches the same remote shell over Wi-Fi and then over a hotspot.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2=".4" gradientUnits="objectBoundingBox">
      <stop stop-color="#131b20"/><stop offset=".55" stop-color="#132524"/><stop offset="1" stop-color="#183335"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#79aaa0" stroke-opacity=".12"/>
    </pattern>
    <pattern id="phosphor" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0.8" y="0.8" width="10.6" height="10.6" rx="1.5" fill="#c9f97b"/>
    </pattern>
    <path id="wifi" d="M545 139 C592 139 586 86 643 86 H749 C798 86 795 139 853 139"/>
    <path id="cell" d="M545 139 C592 139 586 196 643 196 H749 C798 196 795 139 853 139"/>
    <style>
      .packet { stroke-dasharray: 8 510; animation: travel 6s linear 3; opacity: 0 }
      .alternate { animation-delay: 3s }
      @keyframes travel { 0% { stroke-dashoffset: 8; opacity: 0 } 3% { opacity: 1 }
        44% { opacity: 1 } 49%,100% { stroke-dashoffset: -390; opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .packet { animation: none } }
    </style>
  </defs>
  <rect width="1000" height="288" rx="18" fill="url(#night)"/>
  <rect x="1" y="1" width="998" height="286" rx="17" fill="url(#grid)" stroke="#315052"/>
  <path d="M33 49V32h17m900 0h17v17M33 239v17h17m900 0h17v-17" fill="none" stroke="#638079" stroke-width="2"/>
  <g transform="translate(60 60)" fill="url(#phosphor)">
    <!-- Seven-row terminal lettering, on a 12-unit cell grid. -->
    <path d="M0 0h12v12h12v12h12V12h12V0h12v84H48V36H36v12H24V36H12v48H0z"/>
    <path fill-rule="evenodd" d="M84 0h36v12h12v60h-12v12H84V72H72V12h12z M84 12v60h36V12z"/>
    <path d="M156 0h48v12h-48v24h36v12h12v24h-12v12h-48V72h48V48h-36V36h-12V12h12z"/>
    <path d="M216 0h12v36h36V0h12v84h-12V48h-36v36h-12z"/>
  </g>
  <text x="62" y="188" fill="#f1f3e9" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="36" font-weight="600">for Windows</text>
  <g font-family="Consolas, DejaVu Sans Mono, monospace">
    <text x="63" y="236" fill="#b1c6ba" font-size="18"><tspan fill="#c9f97b">PS&gt;</tspan> mosh dev@lab</text>
    <g fill="none" stroke-linecap="round" stroke-width="3">
      <use xlink:href="#wifi" stroke="#8cae68"/><use xlink:href="#cell" stroke="#569899"/>
      <use xlink:href="#wifi" class="packet" stroke="#e8ffab" stroke-width="6"/>
      <use xlink:href="#cell" class="packet alternate" stroke="#a5f1e9" stroke-width="6"/>
    </g>
    <text x="691" y="67" text-anchor="middle" fill="#d2eca7" font-size="18">Wi-Fi</text>
    <text x="691" y="228" text-anchor="middle" fill="#a9ded9" font-size="18">Hotspot</text>
    <g stroke="#d1e2cd" stroke-linejoin="round" stroke-width="2.5" fill="#1a2c2c">
      <rect x="461" y="107" width="83" height="55" rx="5"/>
      <path d="M461 164h83l9 7h-101z"/>
      <path d="m479 128 8 7-8 7m13 0h12" stroke="#c9f97b" fill="none"/>
      <rect x="853" y="107" width="72" height="65" rx="7"/>
      <path d="M854 138h69m-58-17h22m-22 31h22" fill="none"/>
      <circle cx="911" cy="122" r="3" stroke="none" fill="#c9f97b"/>
      <circle cx="911" cy="153" r="3" stroke="none" fill="#c9f97b"/>
    </g>
    <text x="503" y="193" text-anchor="middle" fill="#c8d6cd" font-size="15">Client</text>
    <text x="889" y="194" text-anchor="middle" fill="#c8d6cd" font-size="15">Server</text>
  </g>
</svg>
