# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: YuanpengLi.MoshWindows
PackageVersion: 0.1.0
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  # winget's portable installer only accepts an .exe, which is one of the
  # reasons mosh.exe exists rather than only the .cmd shim.
  - RelativeFilePath: mosh\mosh.exe
    PortableCommandAlias: mosh
Commands:
  - mosh
ReleaseDate: 2026-07-27
Installers:
  # The launcher is a script, so one architecture-neutral package covers both.
  # winget has no "neutral" for zip, so the same archive is listed for each.
  - Architecture: x64
    InstallerUrl: https://github.com/Yuanpeng-Li/mosh-windows/releases/download/v0.1.0/mosh-windows-launcher-v0.1.0.zip
    InstallerSha256: 369F666DEBB337065E3494DC607CFFE10E11EE45AE63D6B444ED67346AB967A2
  - Architecture: arm64
    InstallerUrl: https://github.com/Yuanpeng-Li/mosh-windows/releases/download/v0.1.0/mosh-windows-launcher-v0.1.0.zip
    InstallerSha256: 369F666DEBB337065E3494DC607CFFE10E11EE45AE63D6B444ED67346AB967A2
ManifestType: installer
ManifestVersion: 1.6.0
