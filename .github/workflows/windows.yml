# The CI this port did not have.
#
# Upstream declines Windows patches on the grounds that there is no CI to keep
# them working, and that reasoning is sound: without this, the only thing
# standing between a change and a broken Windows build is somebody remembering
# to check by hand. Everything below runs on every push.
#
# It also covers the CMake build on Linux and macOS, which the autotools CI in
# ci.yml does not touch at all -- and CMake is the only build system the
# Windows port has, so an unverified CMake build is an unverified port.

name: windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  msvc:
    name: windows / msvc
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # vcpkg builds OpenSSL and protobuf from source, which is slow enough to
    # matter. These two steps point vcpkg's binary cache at the Actions cache;
    # a warm run reuses the artefacts instead of rebuilding them.
    - uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: enable vcpkg binary caching
      run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $env:GITHUB_ENV

    # vcpkg.json pins builtin-baseline to one vcpkg commit, on purpose: without
    # it protoc and libprotobuf can come from different checkouts and skew.
    #
    # Fetching that commit is not enough. The runner's vcpkg working tree is
    # newer than our pin, and vcpkg then reads port files whose versions the
    # pinned version database has never heard of:
    #   error: no version database entry for vcpkg-cmake-config at 2026-07-21
    # The tree and the baseline have to be the same commit, so check it out.
    - name: put vcpkg on the commit our baseline names
      run: |
        $vcpkg = $env:VCPKG_INSTALLATION_ROOT
        $base = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
        if (Test-Path "$vcpkg\.git\shallow") { git -C $vcpkg fetch --unshallow } else { git -C $vcpkg fetch origin }
        git -C $vcpkg cat-file -e "$base^{commit}"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg does not have baseline $base" }
        git -C $vcpkg checkout --detach $base
        if ($LASTEXITCODE -ne 0) { throw "could not check out vcpkg at $base" }
        # The bundled vcpkg.exe belongs to whatever commit was checked out
        # before; rebuild it so the tool matches the ports it will read.
        & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed" }
        Write-Host "vcpkg tree and baseline are both $base"

    # The Visual Studio generator rather than Ninja, so this needs no vcvars
    # step and no third-party action to provide one. It is a multi-config
    # generator, hence --config and -C below.
    - name: configure
      run: >
        cmake -S . -B build -A x64
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
        -DBUILD_TESTING=ON

    - name: build
      run: cmake --build build --config RelWithDebInfo

    # --no-tests=error: a configuration that registers nothing must fail rather
    # than report success, which is how a test suite quietly stops existing.
    - name: unit tests and loopback sessions
      run: ctest --test-dir build -C RelWithDebInfo --output-on-failure --no-tests=error

    - name: the three binaries run
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($name in 'mosh-client.exe', 'mosh-server.exe', 'mosh.exe') {
          $found = @(Get-ChildItem -Path build -Recurse -Filter $name)
          if ($found.Count -eq 0) { throw "$name was not built" }
          $exe = $found[0].FullName
          # Let the process finish before reading $LASTEXITCODE. Piping into
          # Select-Object -First throws StopUpstreamCommandsException to cut the
          # pipeline short, so the native command never exits normally and
          # $LASTEXITCODE is left unset -- which this step then reported as
          # "mosh-client.exe --version exited " with nothing after it, while the
          # version line above it had printed perfectly.
          $v = & $exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "$name --version exited $LASTEXITCODE" }
          Write-Host "$name -> $(@($v)[0])"
        }

    # Check the parent process's handshake and detach independently of the
    # loopback sessions, including diagnostics when the child cannot start.
    - name: a server starts, hosts a shell and detaches
      run: |
        $ErrorActionPreference = 'Stop'
        $exe = Get-ChildItem -Path build -Recurse -Filter mosh-server.exe |
               Select-Object -First 1 -ExpandProperty FullName
        $failure = & $exe new -i 127.0.0.1 -- no-such-mosh-test-command.exe 2>&1 | Out-String
        if ($LASTEXITCODE -eq 0 -or $failure -match 'MOSH CONNECT' -or $failure -notmatch 'cannot run') {
          throw "server reported an incorrect startup result for a missing command"
        }
        $out = & $exe new -i 127.0.0.1 2>&1 | Out-String
        if ($out -notmatch 'MOSH CONNECT (\d+) ([A-Za-z0-9/+]{22})') {
          Write-Host "mosh-server printed:"
          Write-Host $out
          throw "no usable MOSH CONNECT line"
        }
        $port = $Matches[1]
        Write-Host "server came up on UDP $port"
        Start-Sleep -Seconds 2
        $srv = @(Get-Process mosh-server -ErrorAction SilentlyContinue)
        if ($srv.Count -lt 1) { throw "the server did not survive its parent -- detach is broken" }
        Write-Host "$($srv.Count) detached server(s) still running, as intended"
        $srv | Stop-Process -Force

    - name: package the tested Windows binaries
      id: package
      run: |
        $version = 'dev'
        if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
          $version = $env:GITHUB_REF_NAME
        }
        ./scripts/package-windows.ps1 -BuildDir build -OutDir dist -Version $version
        "zip=dist/mosh-windows-x64-$version.zip" >> $env:GITHUB_OUTPUT

    - name: install, upgrade and uninstall the release archive
      shell: powershell
      run: ./src/tests/windows-install.ps1 -Archive "${{ steps.package.outputs.zip }}"

    - name: exercise the release updater
      shell: powershell
      run: ./src/tests/windows-update.ps1 -Archive "${{ steps.package.outputs.zip }}"

    - uses: actions/upload-artifact@v4
      with:
        name: mosh-windows-x64
        path: dist/
        if-no-files-found: error

  cmake-posix:
    name: cmake / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: dependencies (linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt update && sudo apt install -y cmake ninja-build protobuf-compiler libprotobuf-dev libutempter-dev libncurses-dev tmux

    - name: dependencies (macos)
      if: startsWith(matrix.os, 'macos')
      run: brew install cmake ninja protobuf tmux

    # ctest runs local.test and the 26 tmux screen-capture tests, and those
    # skip -- reporting success -- without tmux or a UTF-8 locale. Assert both
    # here, so a suite that has quietly stopped testing anything is a failure
    # rather than a green tick.
    - name: preconditions for the display tests
      run: |
        tmux -V
        locale -a | grep -qi 'utf' || { echo "no UTF-8 locale available"; exit 1; }

    - name: configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

    - name: build
      run: cmake --build build

    # --repeat until-pass:2, and only because it was earned: two runs on
    # macos-latest each failed one display test, and a different one each time
    # (network-no-diff, then repeat-with-input) while the autotools job passed
    # the same tests on the same runner. Different test each run is the
    # signature of a loaded machine, not a regression. A genuinely broken test
    # still fails both attempts.
    #
    # The cost is real and worth stating: an intermittent bug that reproduces
    # less than half the time will now show green. If a specific test starts
    # failing repeatedly, that is a bug, not this flag doing its job.
    - name: test
      env:
        LC_ALL: ${{ startsWith(matrix.os, 'ubuntu') && 'C.UTF-8' || 'en_US.UTF-8' }}
      run: ctest --test-dir build --output-on-failure --no-tests=error --repeat until-pass:2

  publish-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [msvc, cmake-posix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: mosh-windows-x64
        path: dist
    - name: publish verified Windows release assets
      working-directory: dist
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 0
        zip="mosh-windows-x64-$TAG.zip"
        sha256sum --check --strict SHA256SUMS
        assets=( "$zip" mosh.exe mosh-client.exe mosh-server.exe SHA256SUMS )
        if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft --generate-notes --title "Mosh for Windows $TAG"
        fi
        if [[ $(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft) == true ]]; then
          gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
        else
          # Support tags created from the Releases UI and reruns. Preserve
          # existing public downloads and reject a rebuild with different bytes.
          for file in "${assets[@]}"; do
            digest=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$file\") | .digest")
            if [[ -z "$digest" ]]; then
              gh release upload "$TAG" "$file" --repo "$REPO"
            else
              [[ "$digest" == "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]
            fi
          done
        fi
